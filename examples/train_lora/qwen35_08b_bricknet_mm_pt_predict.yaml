### model
model_name_or_path: Qwen/Qwen3.5-0.8B
adapter_name_or_path: saves/Qwen3.5-0.8B-Thinking/lora/train_PT_exp0_qwen35_08b_ep3_bs2_ga8_lora64
trust_remote_code: true
flash_attn: auto

### method
stage: sft
do_predict: true
predict_with_generate: true
finetuning_type: lora

### dataset
# Held-out VAL images and inventories with captions cleared to match BrickNet-MM-PT.
eval_dataset: BrickNet-MM-PT-VAL
dataset_dir: data
media_dir: data
template: qwen3_5_nothink
enable_thinking: false
cutoff_len: 4096
preprocessing_num_workers: 16
image_max_pixels: 589824
image_min_pixels: 1024
video_max_pixels: 65536
video_min_pixels: 256

### output
output_dir: saves/Qwen3.5-0.8B-Thinking/lora/eval_PT_exp0_ptval_in4096_out4096_p95_t1_k20
overwrite_output_dir: true
report_to: none

### eval
per_device_eval_batch_size: 1

### generation
max_new_tokens: 4096
do_sample: true
temperature: 1.0
top_k: 20
top_p: 0.95
