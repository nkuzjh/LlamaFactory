### PT-exp2-mm-rowbal-cont3: one continuous three-epoch row-balanced MM/PT run
# Use scripts/launch_bricknet_pt_exp2_mm_rowbal_cont3.py.  Direct execution
# bypasses the immutable-data, cache, parent-adapter, and checkpoint gates.

### model
model_name_or_path: Qwen/Qwen3.5-0.8B
adapter_name_or_path: saves/Qwen3.5-0.8B-Thinking/lora/train_PT_exp2_text8m_qwen35_08b_path7698261_steps250k_bs4_gbs32_lora64_len6401_nopack
trust_remote_code: true
flash_attn: auto

### method
stage: sft
do_train: true
finetuning_type: lora
create_new_adapter: false
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
# The builder contract is one immutable file: 135,051 MM rows followed by
# 135,051 text rows.  Text rows carry images=[] explicitly for Arrow stability.
dataset: BrickNet-PT-exp2-mm-rowbal-cont3
dataset_dir: data/bricknet_pt_exp2_mm_rowbal_cont3
media_dir: data
template: qwen3_5_nothink
enable_thinking: false
cutoff_len: 6400
train_on_prompt: false
packing: false
preprocessing_num_workers: 16
dataloader_num_workers: 4
# Persisted lengths are a cache-integrity field only.  random preserves the
# v2 default sampler; this experiment must not silently become group_by_length.
tokenized_path: .llamafactory_cache/tokenized_dataset/PT-exp2-mm-rowbal-cont3-qwen35-08b-nothink-len6400
length_column_name: length
train_sampling_strategy: random
image_max_pixels: 589824
image_min_pixels: 1024
video_max_pixels: 65536
video_min_pixels: 256

### output
output_dir: saves/Qwen3.5-0.8B-Thinking/lora/train_PT_exp2_mm_rowbal_cont3_qwen35_08b_text8m250k_mm135051_text135051_ep3_bs2_gbs16_lora64_len6400
logging_steps: 10
save_strategy: epoch
save_total_limit: 3
save_only_model: false
plot_loss: true
report_to: none
include_num_input_tokens_seen: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
optim: adamw_torch
bf16: true
ddp_timeout: 180000000
ddp_find_unused_parameters: false
dataloader_drop_last: false
seed: 42

### eval
# This is a training-only run.  VAL512 is consumed only by the post-training
# prediction configs, never by the Trainer.
do_eval: false
eval_strategy: "no"
