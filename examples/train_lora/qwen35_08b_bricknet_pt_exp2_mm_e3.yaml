### PT-exp2-mm-e3: continue e2 for one epoch with the disjoint e3 replay slice

### model
model_name_or_path: Qwen/Qwen3.5-0.8B
adapter_name_or_path: saves/Qwen3.5-0.8B-Thinking/lora/train_PT_exp2_mm_e2_qwen35_08b_text8m_mm135k_replay1to1_ep1_bs2_gbs16_lora64_len6400
trust_remote_code: true
flash_attn: auto

### method
stage: sft
do_train: true
finetuning_type: lora
create_new_adapter: false
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset: BrickNet-PT-exp2-mm-e3
dataset_dir: data
media_dir: data
template: qwen3_5_nothink
enable_thinking: false
cutoff_len: 6400
train_on_prompt: false
packing: false
preprocessing_num_workers: 16
dataloader_num_workers: 4
tokenized_path: .llamafactory_cache/tokenized_dataset/PT-exp2-mm-e3-qwen35-08b-nothink-len6400
image_max_pixels: 589824
image_min_pixels: 1024
video_max_pixels: 65536
video_min_pixels: 256

### output
output_dir: saves/Qwen3.5-0.8B-Thinking/lora/train_PT_exp2_mm_e3_qwen35_08b_text8m_mm135k_replay1to1_ep1_bs2_gbs16_lora64_len6400
logging_steps: 10
save_strategy: epoch
plot_loss: true
report_to: none
include_num_input_tokens_seen: true

### train
per_device_train_batch_size: 2
# Dual-GPU default; launcher overrides this to 8 for a single GPU.
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
optim: adamw_torch
bf16: true
ddp_timeout: 180000000
ddp_find_unused_parameters: false
seed: 42
